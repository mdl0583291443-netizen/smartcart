[project]
name = "smartcart"
version = "0.1.0"
description = "SmartCart (working title) - channel-independent grocery shopping engine"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "SmartCart" }]
dependencies = [
    "pg8000>=1.31.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.11",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "pgserver>=0.1.4",
]

[tool.uv]
# mypy's PyPI wheels ship mypyc-compiled (.pyd) extensions. On this machine a
# Windows Application Control policy blocks loading those DLLs from a venv,
# so mypy is built from source (pure Python) instead. See README/CI notes.
no-binary-package = ["mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartcart"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "N",  # pep8-naming
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "smartcart.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# pg8000 ships no py.typed marker/stubs, and no types-pg8000 stub package
# exists on PyPI (see docs/adr/0009-focused-db-spike.md).
module = "pg8000.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=smartcart --cov-report=term-missing"

[tool.coverage.run]
source = ["src/smartcart"]
branch = true
